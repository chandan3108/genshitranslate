name: Build Android Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets & Sync Capacitor
        run: |
          node -e '
          const fs = require("fs");
          fs.mkdirSync("out", { recursive: true });
          fs.writeFileSync("out/index.html", `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Genshi</title>
            <meta http-equiv="refresh" content="0;url=https://genshitranslate.vercel.app">
          </head>
          <body style="background:#0b0f17;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
            <div style="text-align:center">
              <div style="font-size:24px;font-weight:700;letter-spacing:2px;margin-bottom:8px">GENSHI</div>
              <div style="font-size:13px;color:#94a3b8">Launching Japanese Travel Copilot...</div>
            </div>
            <script>window.location.replace("https://genshitranslate.vercel.app");</script>
          </body>
          </html>`);
          '
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-apk/genshi-travel-copilot.apk
            ls -lh release-apk/genshi-travel-copilot.apk
          else
            echo "Error: APK file not found!"
            find android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshi-travel-copilot-apk
          path: release-apk/genshi-travel-copilot.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "Genshi Native Android App (APK)"
          body: |
            ## Genshi: Japanese Travel Translation Copilot (Native Android)

            Download the standalone native Android `.apk` directly onto your Android device.

            ### Instructions:
            1. Tap **`genshi-travel-copilot.apk`** below to download.
            2. Open the downloaded file.
            3. If Android prompts *"Install unknown apps"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install** and open Genshi!
          draft: false
          prerelease: false
          files: release-apk/genshi-travel-copilot.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
