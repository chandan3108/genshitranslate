name: Build Android Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets & Sync Capacitor
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://genshitranslate.vercel.app"></head><body>Loading Genshi...</body></html>' > out/index.html
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/genshi-travel-copilot.apk
          ls -lh release-apk/genshi-travel-copilot.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshi-travel-copilot-apk
          path: release-apk/genshi-travel-copilot.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "Genshi Native Android App (APK)"
          body: |
            ## Genshi: Japanese Travel Translation Copilot (Native Android)

            Download the standalone native Android `.apk` directly onto your Android device.

            ### Instructions:
            1. Tap **`genshi-travel-copilot.apk`** below to download.
            2. Open the downloaded file.
            3. If Android prompts *"Install unknown apps"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install** and open Genshi!
          draft: false
          prerelease: false
          files: release-apk/genshi-travel-copilot.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
